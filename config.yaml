# =====================================================================
#  CORE CONTRACT: Global configuration of the measurement tool
#  All modules read from here. Change measurement behavior in one place only.
# =====================================================================

# --- Measurement environment ---
environment:
  machine_label: "dev-win11"      # 'dev-win11' for test runs on this machine | 'cloud-vm' for the official measurement
  # Defender configuration is LOCKED for the official measurement (recorded for reproducibility).
  # Recommendation: disable auto-submit; choose one cloud-protection value and keep it for the whole measurement session.
  cloud_protection_enabled: true  # to be finalized with you in Phase 0/3
  auto_submit_enabled: false

# --- System tool paths (verified on this machine) ---
tools:
  csc_exe: "C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
  # MpCmdRun is inside the Platform folder whose version changes -> discovered dynamically at runtime.
  mpcmdrun_glob: "C:/ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe"

# --- Evidence sources: Event log ---
evidence:
  defender_log: "Microsoft-Windows-Windows Defender/Operational"
  # Defender event IDs of interest (Chapter 2 — primary evidence source)
  defender_event_ids:
    1006: "Malware detected (scan)"
    1015: "Suspicious behavior detected"
    1116: "Malware detected (realtime)"
    1117: "Countermeasure action taken"
    1118: "Remediated"
    1119: "Critical error while handling threat"
    5001: "Realtime protection disabled"
    5007: "Configuration changed"
  sysmon_log: "Microsoft-Windows-Sysmon/Operational"
  sysmon_event_ids: [1, 3, 11, 13, 22]   # ProcessCreate, NetworkConnect, FileCreate, RegistrySet, DNS

# --- Timing (seconds) ---
timing:
  collect_window_s: 20     # collect logs for N seconds after triggering
  reset_timeout_s: 60      # soft reset must complete below this threshold
  poll_interval_s: 2

# --- Scoring: 4 states (Chapter 2) ---
scoring:
  states: ["error", "inconclusive", "detected", "not_detected"]
  # Fidelity threshold: below it, the measurement is treated as invalid -> 'inconclusive'
  fidelity_min_valid: 0.5

# --- Database ---
database:
  path: "db/results.sqlite"
  schema: "db/schema.sql"

# --- Payloads ---
payloads:
  variants: ["v0", "v1", "v2", "v3"]
  out_dir: "payloads/out"
