title: KTLD - Process Discovery via LOLBins
id: c5c2e846-15ed-443b-8a3f-69f33d069705
status: experimental
description: |
    Supplementary rule (KTLT-Defender M11) for an Axis-B gap: T1057 Process Discovery (G5) was scored
    not_detected on the measured Defender configuration. Flags process-enumeration binaries launched
    from a scripting host, which is typical of the discovery phase of an intrusion.
references:
    - https://attack.mitre.org/techniques/T1057/
    - KTLT-Defender Axis B, scenario G5 (run_id 5) -> not_detected
author: KTLT Defender (Academy of Cryptography Techniques)
date: 2026-11-27
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\tasklist.exe'
        - Image|endswith: '\qprocess.exe'
        - OriginalFileName:
            - 'tasklist.exe'
            - 'qprocess.exe'
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-Process'
            - 'Get-CimInstance Win32_Process'
            - 'Get-WmiObject Win32_Process'
    parent_scripting:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: (selection_img and parent_scripting) or selection_ps
falsepositives:
    - Monitoring agents and administrative scripts that enumerate processes
level: low
